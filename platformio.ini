; ============================================================================
; PlatformIO Project Configuration - Téléphone LoRa STM32F429
; ============================================================================

[platformio]
src_dir = src/                          ; Votre code applicatif
include_dir = Inc/                      ; Headers générés + vos headers
default_envs = stm32f429_discovery

; ============================================================================
; Environnement : STM32F429 Discovery (ou custom board)
; ============================================================================

[env:stm32f429_discovery]
platform = ststm32
board = stm32f429zi
framework = stm32cube

; ---- Compilation -----------------------------------------------------------
build_flags =
    -D STM32F429xx
    -D HSE_VALUE=8000000
    -D USE_HAL_DRIVER
    -D ARM_MATH_CM4
    -D __FPU_PRESENT=1U
    -D __FPU_USED=1U
    -Wall
    -Wextra
    -O2
    -g3
    -fno-common
    -ffunction-sections
    -fdata-sections
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16
    -mcpu=cortex-m4
    -mthumb

; ---- Sources supplémentaires (code généré CubeMX) --------------------------
board_build.stm32cube.custom = yes
board_build.stm32cube.sources =
    Src/main.c
    Src/stm32f4xx_hal_msp.c
    Src/stm32f4xx_it.c
    Src/system_stm32f4xx.c

; ---- Inclure les dossiers --------------------------------------------------
build_src_filter =
    +<*>
    -<.git/>
    -<test/>

; ---- Upload (ST-LINK) ------------------------------------------------------
upload_protocol = stlink
upload_flags =
    -c
    interface/stlink.cfg
    -c
    target/stm32f4x.cfg

; ---- Debug (ST-LINK) -------------------------------------------------------
debug_tool = stlink
debug_init_break = tbreak main

; ---- Monitoring série ------------------------------------------------------
monitor_speed = 115200
monitor_flags =
    --echo
    --eol
    LF

; ---- Bibliothèques ---------------------------------------------------------
lib_deps =
    ; Aucune dépendance externe (tout est dans lib/)

; ---- Tests -----------------------------------------------------------------
test_ignore = test_desktop

; ============================================================================
; Environnement : Tests unitaires (sur PC)
; ============================================================================

[env:test]
platform = native
framework = 
build_flags =
    -D UNIT_TEST
    -D DEBUG_LEVEL=5
    -Wall
    -g
src_dir = test/