; ============================================================
; SECTION 1 : CONFIGURATION GLOBALE DU PROJET
; ============================================================

[platformio]
; Environnement par défaut (utilisé par "pio run")
default_envs = disco_f429zi

; Dossier du code source principal
src_dir = src

; Dossier des headers globaux
include_dir = include

; Dossier des bibliothèques locales
lib_dir = lib

; Dossier des tests unitaires
test_dir = test


; ============================================================
; SECTION 2 : VARIABLES COMMUNES RÉUTILISABLES
; ============================================================

[common]
; --- Communication série ---
monitor_speed = 115200
monitor_filters = 
    default
    colorize
    time

; --- Protocole de téléversement ---
upload_protocol = stlink

; --- Outil de débogage ---
debug_tool = stlink
debug_speed = 4000
debug_init_break = tbreak main

; --- Dossiers additionnels ---
extra_scripts = 
    pre:tools/pre_build.py
    post:tools/post_build.py


; ============================================================
; SECTION 3 : FLAGS DE COMPILATION COMMUNS
; ============================================================

[common_flags]
build_flags_common = 
    ; ─── OPTIMISATION ───
    -O2
    -g3
    -ggdb
    
    ; ─── AVERTISSEMENTS ───
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    
    ; ─── DÉFINITIONS PRÉPROCESSEUR ───
    -DUSE_HAL_DRIVER
    -DSTM32F429xx
    -DSTM32F429_439xx
    -DHSE_VALUE=8000000
    -DHSE_STARTUP_TIMEOUT=100
    -DARM_MATH_CM4
    
    ; ─── UNITÉ DE CALCUL FLOTTANT (FPU) ───
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    
    ; ─── STANDARDS C/C++ ───
    -std=gnu11
    -std=gnu++17
    
    ; ─── DOSSIERS D'INCLUDES ───
    -Isrc
    -Isrc/drivers
    -Isrc/drivers/lora
    -Isrc/drivers/display
    -Isrc/drivers/touch
    -Isrc/drivers/keypad
    -Isrc/drivers/audio
    -Isrc/drivers/power
    -Isrc/drivers/storage
    -Isrc/ui
    -Isrc/screens
    -Isrc/protocols
    -Isrc/services
    -Isrc/app
    -Isrc/utils
    -Iinclude
    -IInc
    -IDrivers/STM32F4xx_HAL_Driver/Inc
    -IDrivers/CMSIS/Include
    -IDrivers/CMSIS/Device/ST/STM32F4xx/Include


; ============================================================
; SECTION 4 : ENVIRONNEMENT PRINCIPAL - DISCOVERY F429ZI
; ============================================================

[env:disco_f429zi]
; --- Plateforme et carte ---
platform = ststm32
board = disco_f429zi
framework = stm32cube

; --- Microcontrôleur ---
board_build.mcu = stm32f429zit6
board_build.f_cpu = 180000000L

; --- Flags spécifiques ---
build_flags = 
    ${common_flags.build_flags_common}
    -DPLATFORM_DISCOVERY
    -DBOARD_DISCO_F429ZI
    -DHAS_SDRAM
    -DHAS_LTDC
    -DHAS_DMA2D

; --- Filtre des sources ---
build_src_filter = 
    +<*>
    -<.git/>
    -<test/>
    -<*/.svn/>

; --- Bibliothèques externes ---
lib_deps = 
    ; Aucune pour l'instant (HAL STM32 suffisant)

; --- Téléversement ---
upload_flags = 
    -c interface/stlink.cfg
    -c target/stm32f4x.cfg

; --- Moniteur série ---
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}


; ============================================================
; SECTION 5 : ENVIRONNEMENT ALTERNATIF - NUCLEO F429ZI
; ============================================================

[env:nucleo_f429zi]
platform = ststm32
board = nucleo_f429zi
framework = stm32cube

board_build.mcu = stm32f429zit6
board_build.f_cpu = 180000000L

build_flags = 
    ${common_flags.build_flags_common}
    -DNUCLEO_BOARD
    -DNO_SDRAM
    -DNO_LTDC

build_src_filter = ${env:disco_f429zi.build_src_filter}

debug_tool = stlink
upload_protocol = stlink
monitor_speed = ${common.monitor_speed}


; ============================================================
; SECTION 6 : ENVIRONNEMENT DE DÉBOGAGE
; ============================================================

[env:disco_f429zi_debug]
platform = ststm32
board = disco_f429zi
framework = stm32cube

board_build.mcu = stm32f429zit6
board_build.f_cpu = 180000000L

build_flags = 
    ${common_flags.build_flags_common}
    -O0                     ; Pas d'optimisation
    -g3                     ; Debug maximum
    -DPLATFORM_DISCOVERY
    -DDEBUG
    -DENABLE_DEBUG=1

build_src_filter = ${env:disco_f429zi.build_src_filter}

debug_tool = stlink
upload_protocol = stlink
monitor_speed = ${common.monitor_speed}


; ============================================================
; SECTION 7 : ENVIRONNEMENT DE RELEASE (PRODUCTION)
; ============================================================

[env:disco_f429zi_release]
platform = ststm32
board = disco_f429zi
framework = stm32cube

board_build.mcu = stm32f429zit6
board_build.f_cpu = 180000000L

build_flags = 
    ${common_flags.build_flags_common}
    -O3                     ; Optimisation maximale
    -flto                   ; Link-Time Optimization
    -DPLATFORM_DISCOVERY
    -DNDEBUG                ; Désactiver les assertions
    -DENABLE_DEBUG=0

build_src_filter = ${env:disco_f429zi.build_src_filter}

debug_tool = stlink
upload_protocol = stlink
monitor_speed = ${common.monitor_speed}


; ============================================================
; SECTION 8 : ENVIRONNEMENT DE TESTS (SUR PC)
; ============================================================

[env:native]
platform = native
test_framework = unity

build_src_filter = 
    +<test/**>
    +<src/utils/**>
    -<test/mocks/>

build_flags = 
    -std=gnu++17
    -Isrc
    -Isrc/utils
    -Iinclude


; ============================================================
; SECTION 9 : SCRIPTS PERSONNALISÉS
; ============================================================

[env:disco_f429zi_custom]
platform = ststm32
board = disco_f429zi
framework = stm32cube

board_build.mcu = stm32f429zit6
board_build.f_cpu = 180000000L

build_flags = ${common_flags.build_flags_common}
build_src_filter = ${env:disco_f429zi.build_src_filter}

; Scripts exécutés avant/après le build
extra_scripts = 
    pre:tools/pre_build.py      ; Génération de code, vérifications
    post:tools/post_build.py    ; Copie du binaire, statistiques

debug_tool = stlink
upload_protocol = stlink
